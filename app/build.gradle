plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novaingine.v2'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.novaingine.v2'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -Wall -Wextra'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../Engine/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
